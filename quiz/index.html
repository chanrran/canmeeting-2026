<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>2026 송년회 퀴즈</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
  }
  #shot {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain; display: none;
    user-select: none; -webkit-user-drag: none;
  }
  #load { text-align: center; color: #8a8a90; font-size: 15px; line-height: 2; }
  #load b { display: block; color: #fff; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .netbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: #8a6a3b; color: #fff; font-size: 13px; text-align: center;
    padding: 6px 10px; display: none;
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="load"><b>2026 송년회 퀴즈</b><span id="pg">화면을 준비하고 있습니다</span></div>
  <img id="shot" alt="퀴즈 화면">
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=5"></script>
<script src="app.js?v=5"></script>
<script>
(function () {
  'use strict';
  var img = document.getElementById('shot');
  var load = document.getElementById('load');
  var pg = document.getElementById('pg');
  var cur = -1, loaded = false;

  function show(i) {
    cur = i;
    if (!loaded) return;
    img.src = Q.src(i);
  }

  Q.keepAwake();

  Q.preload(function (done, total) {
    pg.textContent = '불러오는 중 ' + done + ' / ' + total;
  }).then(function () {
    loaded = true;
    load.style.display = 'none';
    img.style.display = 'block';
    show(cur < 0 ? 0 : cur);
  });

  Q.watch(function (i) { show(i); });
})();
</script>
</body>
</html>
