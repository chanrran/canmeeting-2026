<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>2026 송년회 퀴즈</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%;
    background:#000; color:#fff; overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh;
          display:flex; align-items:center; justify-content:center; }
  #shot { max-width:100%; max-height:100%; width:auto; height:auto;
          object-fit:contain; display:none; user-select:none; -webkit-user-drag:none; }
  #load { text-align:center; color:#8a8a90; font-size:15px; line-height:2; padding:0 24px; }
  #load b { display:block; color:#fff; font-size:17px; font-weight:600; margin-bottom:6px; }

  /* 묶음 안에서만 쓰는 이동 버튼 — 한 장짜리 문제에서는 나오지 않습니다 */
  #nav { position:fixed; left:0; right:0; bottom:0; display:none;
         justify-content:center; align-items:center; gap:10px;
         padding:10px 12px calc(10px + env(safe-area-inset-bottom));
         background:linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0)); z-index:5; }
  #nav button { font:inherit; font-size:15px; font-weight:600; color:#fff;
                background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3);
                border-radius:999px; padding:11px 20px; touch-action:manipulation; }
  #nav button:disabled { opacity:.3; }
  #cnt { font-size:14px; color:#d6d6da; min-width:46px; text-align:center; }
  .netbar { position:fixed; top:0; left:0; right:0; z-index:10;
            background:#8a6a3b; color:#fff; font-size:13px; text-align:center;
            padding:6px 10px; display:none; }
</style>
</head>
<body>

<div id="wrap">
  <div id="load"><b>2026 송년회 퀴즈</b><span id="pg">화면을 준비하고 있습니다</span></div>
  <img id="shot" alt="퀴즈 화면">
</div>
<div id="nav">
  <button id="back">◀ 이전</button>
  <span id="cnt"></span>
  <button id="fwd">다음 ▶</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=10"></script>
<script src="app.js?v=10"></script>
<script>
(function () {
  'use strict';
  var img = document.getElementById('shot');
  var load = document.getElementById('load');
  var pg = document.getElementById('pg');
  var nav = document.getElementById('nav');
  var back = document.getElementById('back');
  var fwd = document.getElementById('fwd');
  var cnt = document.getElementById('cnt');

  var gi = 0, off = 0, started = false;

  function paint() {
    var g = Q.group(gi);
    if (off > g.length - 1) off = g.length - 1;
    if (off < 0) off = 0;
    img.src = Q.src(g[off]);
    if (g.length > 1) {
      nav.style.display = 'flex';
      back.disabled = (off <= 0);
      fwd.disabled = (off >= g.length - 1);
      cnt.textContent = (off + 1) + ' / ' + g.length;
    } else {
      nav.style.display = 'none';
    }
    if (!started) {
      started = true;
      load.style.display = 'none';
      img.style.display = 'block';
      Q.preloadAround(g[0]);
    }
    if (Q.onBeat) Q.onBeat();
  }

  back.onclick = function () { off--; paint(); };
  fwd.onclick = function () { off++; paint(); };

  img.onerror = function () {
    var want = img.getAttribute('src');
    setTimeout(function () { if (img.getAttribute('src') === want) img.src = want; }, 1500);
  };

  Q.keepAwake();
  Q.watch(function (g) {
    if (g !== gi) off = 0;      /* 진행자가 묶음을 바꾸면 그 묶음의 첫 장으로 */
    gi = g;
    paint();
  });
  Q.beat(function () { return gi; });

  setTimeout(function () {
    if (!started) pg.textContent = '연결하는 중입니다. 잠시만 기다려 주세요';
  }, 5000);
})();
</script>
</body>
</html>
