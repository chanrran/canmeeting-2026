<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>진행자 화면 · 우리 팀 사용설명서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../style.css?v=20260921h">
</head>
<body class="h">
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../config.js?v=20260921h"></script>
<script src="../app.js?v=20260921h"></script>
<script>
(function () {
  'use strict';
  const e = App.esc;
  const root = document.getElementById('root');

  /* ---------------- 관리자 암호 확인 ---------------- */
  if (new URLSearchParams(location.search).get('key') !== CONFIG.ADMIN_KEY) {
    root.innerHTML = '<div class="gate">관리자 암호가 필요합니다</div>';
    return;
  }

  const H = { state: null, resp: {}, praises: [], team: null };
  const PURL = App.participantUrl();

  root.innerHTML =
    '<header class="h-top"><h1>진행자 화면</h1><span class="mode ' + (App.mode === 'demo' ? 'demo' : '') + '">' +
      (App.mode === 'demo' ? '데모 모드 · 이 브라우저에서만 저장' : 'Firebase 연결') + '</span><span class="sp"></span>' +
      '<a href="../screen.html" target="_blank" rel="noopener">큰 화면 열기 ↗</a>' +
      '<a href="../" target="_blank" rel="noopener">참가자 화면 열기 ↗</a>' +
      '<a href="?key=' + encodeURIComponent(CONFIG.ADMIN_KEY) + '&tab=quiz" target="_blank" rel="noopener" class="quizlink">팝업 퀴즈 창 열기 ↗</a></header>' +
    '<nav class="h-tabs" id="tabs"><button type="button" class="tab on" data-tab="run">워크숍 진행</button><button type="button" class="tab" data-tab="quiz">팝업 퀴즈</button></nav>' +
    '<div class="h-wrap"><aside class="h-side" id="side"></aside><main class="h-main">' +
      '<section class="panel quizpanel tab-quiz" id="quiz"></section>' +
      '<section class="panel now tab-run" id="ctx"></section>' +
      '<section class="panel tab-run"><h2>제출 현황</h2><div class="status-wrap" id="status"></div></section>' +
      '<section class="panel tab-run" id="assign"></section>' +
      '<section class="panel tab-run" id="prompt"></section>' +
      '<section class="panel tab-run" id="members"></section>' +
      '<section class="panel tab-run" id="data"></section>' +
    '</main></div>';

  const $ = (id) => document.getElementById(id);

  /* ---------------- 화면 나누기: 워크숍 진행 / 팝업 퀴즈 ---------------- */
  function setTab(t) {
    document.body.classList.toggle('only-quiz', t === 'quiz');
    document.querySelectorAll('#tabs .tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
    App.ls.set('canmeeting_host_tab', t);
  }
  document.querySelectorAll('#tabs .tab').forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
  setTab(new URLSearchParams(location.search).get('tab') === 'quiz' ? 'quiz' : 'run');

  /* ---------------- 데이터 구독 ---------------- */
  App.ready.then(() => {
    App.watchMembers(() => { renderMembers(); if (H.state) { H.state = App.withDefaults(H.state); renderSide(); renderCtx(); renderAssign(); renderStatus(); } });
    App.db.watchDoc('session/state', (d) => {
      if (!d) { App.db.replace('session/state', App.defaultState()); return; }
      H.state = App.withDefaults(d);
      renderSide(); renderCtx(); renderAssign(); renderStatus(); fillClosingOnce();
    });
    App.db.watchCol('responses', (list) => { H.respLoaded = true; H.resp = {}; list.forEach((r) => (H.resp[r.id] = r)); renderStatus(); renderCtx(); renderQuiz(); });
    App.db.watchCol('praises', (list) => { H.praisesLoaded = true; H.praises = list; renderStatus(); renderCtx(); renderAssign(); });
    App.db.watchDoc('teamManual/current', (d) => { H.team = d; renderCtx(); fillResultOnce(); });
    App.db.watchDoc('quizSecret/current', (d) => { H.secret = d; renderQuiz(); });
  });
  const setState = (patch) => App.db.set('session/state', patch);
  /* 배정표는 통째로 바꿔야 함(합치기 저장이면 빠진 사람의 예전 배정이 남음): 비운 뒤 새로 저장 */
  const setAssignments = async (map, extra) => {
    await App.db.set('session/state', { praiseAssignments: null });
    await App.db.set('session/state', Object.assign({ praiseAssignments: map }, extra || {}));
  };

  /* ---------------- 단계 이동 ---------------- */
  function go(k) {
    const st = H.state;
    const patch = { stage: k, breakOn: false };
    if (k === 'emotion_person' && !st.emotionCurrent) patch.emotionCurrent = st.emotionOrder[0];
    if (k === 'manual_person' && !st.manualCurrent) { patch.manualCurrent = st.manualOrder[0]; patch.manualRevealed = false; }
    if (k === 'input_manual' && !st.praiseAssignments) { patch.praiseAssignments = App.makeAssignments(); patch.praiseRound = App.now(); }
    setState(patch);
  }
  function renderSide() {
    const st = H.state;
    const i = App.stageIndex(st.stage);
    $('side').innerHTML = '<h2>진행 단계 (점선 = 입력 시간)</h2>' +
      App.STAGES.map((s) => '<button type="button" class="stage-btn' + (s.input || s.key === 'lobby' ? ' input' : '') + (s.key === st.stage ? ' on' : '') + '" data-k="' + s.key + '"><span class="t">' + s.time + '</span><span>' + e(s.name) + '</span></button>').join('') +
      '<div class="nav"><button type="button" class="hb" id="prev"' + (i <= 0 ? ' disabled' : '') + '>◀ 이전 단계</button><button type="button" class="hb solid" id="next"' + (i >= App.STAGES.length - 1 ? ' disabled' : '') + '>다음 단계 ▶</button></div>' +
      '<button type="button" class="hb big brk' + (st.breakOn ? ' on' : '') + '" id="brk">' + (st.breakOn ? '쉬는 시간 끝내기 (원래 화면으로)' : '☕ 쉬는 시간 화면 띄우기') + '</button>' +
      '<p class="note" style="margin-top:6px">' + (st.breakOn ? '지금 큰 화면에 쉬는 시간 화면이 나오고 있습니다. 단계 버튼을 눌러도 쉬는 시간이 끝납니다.' : '언제든 누르면 큰 화면만 쉬는 시간 화면으로 바뀝니다. 지금 단계와 휴대폰 화면은 그대로 유지됩니다.') + '</p>';
    $('side').querySelectorAll('.stage-btn').forEach((b) => (b.onclick = () => go(b.dataset.k)));
    $('brk').onclick = () => setState({ breakOn: !st.breakOn });
    $('prev').onclick = () => go(App.STAGES[i - 1].key);
    $('next').onclick = () => go(App.STAGES[i + 1].key);
  }

  /* ---------------- 발표 순서 공통 ---------------- */
  function orderList(orderField, curField, statusFn) {
    const st = H.state;
    const order = st[orderField];
    return '<ol class="order">' + order.map((id, i) =>
      '<li class="' + (id === st[curField] ? 'cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + e(App.label(id)) + '</span><span class="st">' + (statusFn ? statusFn(id) : '') + '</span>' +
      '<button type="button" data-mv="' + id + '" data-d="-1" aria-label="' + e(App.label(id)) + ' 위로"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
      '<button type="button" data-mv="' + id + '" data-d="1" aria-label="' + e(App.label(id)) + ' 아래로"' + (i === order.length - 1 ? ' disabled' : '') + '>↓</button></li>').join('') + '</ol>';
  }
  function wireOrder(el, orderField) {
    el.querySelectorAll('[data-mv]').forEach((b) => (b.onclick = () => {
      const order = H.state[orderField].slice();
      const i = order.indexOf(b.dataset.mv), j = i + Number(b.dataset.d);
      if (j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      setState({ [orderField]: order });
    }));
  }
  function step(orderField, curField, d, extra) {
    const st = H.state;
    const order = st[orderField];
    const i = order.indexOf(st[curField]);
    const j = i < 0 ? 0 : i + d;
    if (j < 0 || j >= order.length) return;
    setState(Object.assign({ [curField]: order[j] }, extra || {}));
  }
  const nextName = (orderField, curField) => {
    const o = H.state[orderField]; const i = o.indexOf(H.state[curField]);
    return i >= 0 && i < o.length - 1 ? App.label(o[i + 1]) : '';
  };

  /* ---------------- 칭찬 공개 ---------------- */
  const praisesFor = (id) => H.praises.filter((p) => p.toId === id && p.round === H.state.praiseRound).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  function praiseStep() {
    const st = H.state, order = st.praiseOrder;
    if (!st.praiseTarget) return { label: '시작: ' + App.nim(order[0]) + '에게 도착한 칭찬 보여 주기', run: () => setState({ praiseTarget: order[0] }) };
    const shown = st.revealedPraises.filter((p) => p.toId === st.praiseTarget).map((p) => p.id);
    const recv = praisesFor(st.praiseTarget);
    const nx = recv.find((p) => !shown.includes(p.id));
    if (nx) return {
      label: App.nim(st.praiseTarget) + '의 ' + (shown.length + 1) + '번째 칭찬 공개',
      run: () => setState({ revealedPraises: st.revealedPraises.concat([{ id: nx.id, toId: nx.toId, text: nx.text }]) })
    };
    const i = order.indexOf(st.praiseTarget);
    if (i < order.length - 1) return { label: '다음 사람: ' + App.label(order[i + 1]) + ' ▶', run: () => setState({ praiseTarget: order[i + 1] }) };
    return { label: '모든 칭찬을 공개했습니다', run: null };
  }

  /* ---------------- 지금 단계 패널 ---------------- */
  function renderCtx() {
    if (!H.state) return;
    const st = H.state;
    const el = $('ctx');
    let h = '<h2>지금 단계 · ' + e(App.stageName(st.stage)) + '</h2>';
    const R = H.resp;
    const cnt = (fn) => App.members.filter((m) => fn(R[m.id])).length;
    const N = App.members.length;

    switch (st.stage) {
      case 'title':
        h += '<p class="desc">큰 화면에 제목이 나옵니다. 담당님 인사말이 끝나면 "다음 단계"를 눌러 접속 안내로 넘어가세요.</p>'; break;
      case 'lobby':
        h += '<p class="desc">참가자 주소: <b>' + e(PURL) + '</b><br>접속 ' + cnt(App.done.joined) + '/' + N + ' · 올해 한 단어 ' + cnt(App.done.yearWord) + '/' + N + '</p>'; break;
      case 'input_emotion':
        h += '<p class="desc">감정 곡선 제출 ' + cnt(App.done.emotion) + '/' + N + '. 입력이 끝나면 "다음 단계"로 발표를 시작하세요.</p>'; break;
      case 'emotion_person':
        h += '<p class="desc">발표자 한 명의 곡선이 큰 화면에 나옵니다. 1인 3분.</p>' +
                    '<div class="tools"><button type="button" class="hb" id="p1">◀ 이전 발표자</button><button type="button" class="hb solid big" id="n1">다음 발표자' + (nextName('emotionOrder', 'emotionCurrent') ? ': ' + e(nextName('emotionOrder', 'emotionCurrent')) : '') + ' ▶</button><button type="button" class="hb" id="sh1">순서 무작위 섞기</button></div>' +
          orderList('emotionOrder', 'emotionCurrent', (id) => (App.done.emotion(R[id]) ? '' : App.done.emotionCount(R[id]) + '/' + App.MONTH_COUNT));
        break;
      case 'emotion_team':
        h += '<p class="desc">' + N + '명의 곡선이 겹쳐 보입니다. 큰 화면 오른쪽 카드 세 개(가장 좋았던 달·힘들었던 달·엇갈린 달)를 누르면 그 달의 이유가 펼쳐집니다.</p>'; break;
      case 'input_manual': {
        const sent = App.members.reduce((a, m) => a + App.done.praiseSent(R[m.id], st.praiseRound), 0);
        h += '<p class="desc">설명서 제출 ' + cnt(App.done.manual) + '/' + N + ' · 칭찬 ' + sent + '/' + App.praiseTotal(st) + '</p>' +
          '<p class="note">칭찬할 두 분은 이 단계에 들어올 때 자동으로 배정되었습니다. 발표로 넘어가기 전에 "누구의 설명서일까" 순서를 무작위로 섞어 두세요.</p>'; break;
      }
      case 'manual_person': {
        const nm = nextName('manualOrder', 'manualCurrent');
        h += '<p class="desc">큰 화면에 이름을 가린 설명서가 나옵니다 → 다 같이 맞혀 본 뒤 "이름 공개" → 주인공이 설명합니다.</p>' +
          '<div class="tools">' +
          (st.manualRevealed
            ? '<button type="button" class="hb solid big" id="n2">다음 사람' + (nm ? ': ' + e(nm) : '') + ' (이름 가림) ▶</button>'
            : '<button type="button" class="hb solid big" id="rv">이름 공개</button><button type="button" class="hb" id="n2">건너뛰기 ▶</button>') +
          '<button type="button" class="hb" id="p2">◀ 이전 사람</button><button type="button" class="hb" id="sh2">순서 무작위 섞기</button></div>' +
          orderList('manualOrder', 'manualCurrent', (id) => (App.done.manual(R[id]) ? '' : '미제출'));
        break;
      }
      case 'praise': {
        const ps = praiseStep();
        const shownCnt = st.praiseTarget ? st.revealedPraises.filter((p) => p.toId === st.praiseTarget).length : 0;
        h += '<p class="desc">칭찬을 공개하는 동안 아래 "우리 팀 사용설명서 프롬프트"를 Claude·GPT에 돌려 두세요.' +
          (st.praiseTarget ? '<br>지금: <b>' + e(App.label(st.praiseTarget)) + '</b> · ' + shownCnt + '/' + praisesFor(st.praiseTarget).length + '장 공개' : '') + '</p>' +
          '<div class="tools"><button type="button" class="hb solid big" id="pn"' + (ps.run ? '' : ' disabled') + '>' + e(ps.label) + '</button>' +
          '<button type="button" class="hb" id="pp">◀ 이전 사람</button><button type="button" class="hb" id="sh3">순서 무작위 섞기</button></div>' +
          orderList('praiseOrder', 'praiseTarget', (id) => praisesFor(id).length + '장');
        break;
      }
      case 'team_manual': {
        if (!H.team || !H.team.markdown) { h += '<div class="warnline">아직 결과를 반영하지 않았습니다. 아래 "우리 팀 사용설명서 프롬프트"에서 결과를 붙여넣고 "큰 화면에 반영"을 눌러 주세요.</div>'; break; }
        const n = App.parseTeam(H.team.markdown).slides.length;
        const cur = Math.min(st.teamSlide || 0, n - 1);
        h += '<p class="desc">요약 화면 <b>' + (cur + 1) + ' / ' + n + '</b> · 큰 화면 창에서 키보드 ← → 로도 넘길 수 있습니다.</p>' +
          '<div class="tools"><button type="button" class="hb" id="sp"' + (cur <= 0 ? ' disabled' : '') + '>◀ 이전 슬라이드</button><button type="button" class="hb solid big" id="sn"' + (cur >= n - 1 ? ' disabled' : '') + '>다음 슬라이드 ▶</button></div>';
        break;
      }
      case 'input_keyword':
        h += '<p class="desc">내년 키워드 ' + cnt(App.done.nextYearWord) + '/' + N + '</p>'; break;
      case 'closing':
        h += '<p class="desc">모두의 내년 키워드가 큰 화면에 단어 벽으로 나옵니다. 함께 본 뒤 "다음 단계"로 담당님 마무리 인사로 넘어가세요.</p>'; break;
      case 'farewell': {
        const cw = st.closingCurrent;
        const nw = nextName('closingOrder', 'closingCurrent');
        h += '<p class="desc">한 분씩 ' + App.WORD_SECONDS + '초 동안 마무리 한마디를 합니다.' + (cw ? ' 지금: <b>' + e(App.label(cw)) + '</b>' : ' "시작"을 누르면 첫 번째 분부터 시작합니다.') + '</p>' +
          '<div class="tools">' +
          (cw
            ? '<button type="button" class="hb solid big" id="w1">다음 분' + (nw ? ': ' + e(nw) : ' (끝내고 Wrap-up)') + ' ▶</button><button type="button" class="hb" id="w0">◀ 이전 분</button><button type="button" class="hb" id="wr">시간 다시 시작</button>'
            : '<button type="button" class="hb solid big" id="ws">시작</button>') +
          '<button type="button" class="hb" id="wsh">순서 무작위 섞기</button></div>' +
          orderList('closingOrder', 'closingCurrent');
        break;
      }
    }
    el.innerHTML = h;

    const on = (id, fn) => { const b = el.querySelector('#' + id); if (b) b.onclick = fn; };
    on('n1', () => step('emotionOrder', 'emotionCurrent', 1));
    on('p1', () => step('emotionOrder', 'emotionCurrent', -1));
    on('sh1', () => { const o = App.shuffle(st.emotionOrder); setState({ emotionOrder: o, emotionCurrent: o[0] }); });
    on('ws', () => setState({ closingCurrent: st.closingOrder[0], closingStartedAt: App.now(), closingDone: false }));
    on('w1', () => {
      const o = st.closingOrder, i = o.indexOf(st.closingCurrent);
      if (i >= o.length - 1) { setState({ closingCurrent: null, closingStartedAt: 0, closingDone: true }); return; }
      setState({ closingCurrent: o[i + 1], closingStartedAt: App.now(), closingDone: false });
    });
    on('w0', () => { const o = st.closingOrder, i = o.indexOf(st.closingCurrent); if (i > 0) setState({ closingCurrent: o[i - 1], closingStartedAt: App.now() }); });
    on('wr', () => setState({ closingStartedAt: App.now() }));
    on('wsh', () => { const o = App.shuffle(st.closingOrder); setState({ closingOrder: o, closingCurrent: st.closingCurrent ? o[0] : null, closingStartedAt: st.closingCurrent ? App.now() : 0 }); });
    on('rv', () => setState({ manualRevealed: true }));
    on('n2', () => step('manualOrder', 'manualCurrent', 1, { manualRevealed: false }));
    on('p2', () => step('manualOrder', 'manualCurrent', -1, { manualRevealed: false }));
    on('sh2', () => { const o = App.shuffle(st.manualOrder); setState({ manualOrder: o, manualCurrent: o[0], manualRevealed: false }); });
    on('pn', () => { const ps = praiseStep(); if (ps.run) ps.run(); });
    on('pp', () => step('praiseOrder', 'praiseTarget', -1));
    on('sh3', () => setState({ praiseOrder: App.shuffle(st.praiseOrder), praiseTarget: null }));
    on('sp', () => setState({ teamSlide: Math.max(0, (st.teamSlide || 0) - 1) }));
    on('sn', () => setState({ teamSlide: (st.teamSlide || 0) + 1 }));
    const of = { emotion_person: 'emotionOrder', manual_person: 'manualOrder', praise: 'praiseOrder', farewell: 'closingOrder' }[st.stage];
    if (of) wireOrder(el, of);
  }

  /* ---------------- 제출 현황 ---------------- */
  function renderStatus() {
    if (!H.state) return;
    const R = H.resp, round = H.state.praiseRound;
    const cell = (ok, part) => (ok ? '<td class="y">✓</td>' : part ? '<td class="part">' + part + '</td>' : '<td class="n">-</td>');
    const tot = { j: 0, y: 0, em: 0, mn: 0, pr: 0, nx: 0 };
    let rows = '';
    App.members.forEach((m) => {
      const r = R[m.id];
      const emN = App.done.emotionCount(r);
      const mnDone = App.done.manual(r);
      const mnPart = !mnDone && r && r.manual ? '작성 중' : '';
      const pr = App.done.praiseSent(r, round);
      const myA = H.state.praiseAssignments && H.state.praiseAssignments[m.id];
      const need = myA ? myA.length : App.praisePer(App.members.length);
      if (App.done.joined(r)) tot.j++;
      if (App.done.yearWord(r)) tot.y++;
      if (App.done.emotion(r)) tot.em++;
      if (mnDone) tot.mn++;
      tot.pr += pr;
      if (App.done.nextYearWord(r)) tot.nx++;
      rows += '<tr><td>' + e(m.label) + '</td>' + cell(App.done.joined(r)) + cell(App.done.yearWord(r)) +
        cell(App.done.emotion(r), emN ? emN + '/' + App.MONTH_COUNT : '') + cell(mnDone, mnPart) + cell(pr >= need, pr ? pr + '/' + need : '') + cell(App.done.nextYearWord(r)) + '</tr>';
    });
    const N = App.members.length;
    $('status').innerHTML = '<table class="status"><thead><tr><th>이름</th><th>접속</th><th>올해 한 단어</th><th>감정 곡선</th><th>사용설명서</th><th>칭찬</th><th>내년 키워드</th></tr></thead><tbody>' + rows +

  let previewShown = null;

  async function quizAction(act, id) {
    const z = App.quizById(id);
    if (act === 'hide') { previewShown = null; renderQuiz(); return; }
    if (act === 'close') { await App.db.set('session/state', { quiz: null }); return; }
    if (act === 'final') { await App.db.set('session/state', { quiz: { id: null, phase: 'final', startedAt: App.now(), choices: [] } }); return; }
    if (act === 'reset') {
      if (!confirm('퀴즈 입력과 점수를 모두 지울까요? 워크숍 전 연습 기록을 지울 때만 쓰세요.')) return;
      await App.db.replace('session/state', Object.assign({}, H.state, { quiz: null, quizResults: {} }));
      for (const m of App.members) await App.db.set('responses/' + m.id, { quiz: null, quizPick: null });
      return;
    }
    if (!z) return;
    if (act === 'input') { await App.db.set('session/state', { quiz: { id: id, phase: 'input', startedAt: 0, choices: [] } }); return; }
    if (act === 'peek' || act === 'ask') {
      let made = H.secret && H.secret.id === id ? H.secret : null;
      if (!made) {
        made = Object.assign({ id: id }, App.makeQuiz(z, quizInputs(id)));

      if (act === 'peek') { previewShown = id; renderQuiz(); return; }
      previewShown = null;
      await App.db.set('session/state', { quiz: { id: id, phase: 'question', startedAt: App.now(), choices: made.choices } });
      return;
    }
    if (act === 'reveal') {
      const made = H.secret && H.secret.id === id ? H.secret : Object.assign({ id: id }, App.makeQuiz(z, quizInputs(id)));
      const rows = App.scoreQuiz(z, made.answer, quizPicks(id));
      const res = {}; res[id] = { answer: made.answer, choices: made.choices, detail: made.detail || null, rows: rows, at: App.now() };

  /* ---------------- 칭찬 배정 ---------------- */
  let reassignArmed = false;

  let repairing = false;
  async function autoRepair() {
    if (repairing || !H.respLoaded || !H.praisesLoaded) return;
    repairing = true;
    try {
      const st = H.state, round = st.praiseRound;
      const sentBy = {};
      Object.keys(H.resp).forEach((id) => { const p = H.resp[id].praise; if (p && p.round === round) sentBy[id] = p.sentTo || []; });
      const nm = App.repairAssignments(st.praiseAssignments, sentBy);
      if (!nm) { App.showError('명단에 맞춰 칭찬 배정을 자동으로 맞추지 못했습니다. 칭찬 배정의 "다시 배정"을 눌러 주세요(작성된 칭찬이 지워집니다).'); return; }
      await setAssignments(nm);
      /* 명단에서 빠진 분에게 간 칭찬은 지우고, 각자의 '보낸 칭찬' 기록도 새 배정에 맞춤 */
      for (const p of H.praises) if (p.round === round && !App.memberIds.includes(p.toId)) await App.db.del('praises/' + p.id);
      for (const id of Object.keys(sentBy)) {
        if (!App.memberIds.includes(id)) continue;
        const keep = sentBy[id].filter((b) => (nm[id] || []).includes(b));
        if (keep.length !== sentBy[id].length) await App.db.set('responses/' + id, { praise: { round: round, sentTo: keep } });
      }
    } finally { setTimeout(() => { repairing = false; }, 1500); }
  }

    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  $('csv1').onclick = () => {
    const head = ['이름', '올해 한 단어', '내년 키워드'].concat(Array.from({ length: App.MONTH_COUNT }, (_, i) => (i + 1) + '월 점수'), Array.from({ length: App.MONTH_COUNT }, (_, i) => (i + 1) + '월 이유'),
      ['가장 좋았던 순간', '힘들었던 순간에서 배운 것', '제품명(별명)', 'MBTI', '잘하는 것 1', '잘하는 것 2', '잘하는 것 3', '작동 방식', '제품 특성', '주의사항', '고장 신호', '충전 방법']);
    const rows = [head].concat(App.members.map((m) => {
      const r = H.resp[m.id] || {}, ms = App.months(r), em = r.emotion || {}, mn = r.manual || {};
      return [m.label, r.yearWord, r.nextYearWord].concat(ms.map((d) => d.score), ms.map((d) => d.reason),
        [em.bestMoment, em.lowestLesson, mn.nickname, mn.mbti, (mn.strengths || [])[0], (mn.strengths || [])[1], (mn.strengths || [])[2], mn.workStyle, mn.personality, mn.respect, mn.tiredSignal, mn.recharge]);

  };
  $('csv2').onclick = () => {
    const list = H.praises.filter((p) => p.round === H.state.praiseRound)
      .sort((a, b) => App.memberIds.indexOf(a.toId) - App.memberIds.indexOf(b.toId));
    download('캔미팅_칭찬_전체.csv', csv([['받는 사람', '내용']].concat(list.map((p) => [App.label(p.toId), p.text]))));
  };

  function twoStep(btn, armedText, run) {
    let armed = false, t = null;
    const orig = btn.textContent;
    btn.onclick = async () => {
      if (!armed) {
        armed = true; btn.textContent = armedText; btn.classList.add('danger', 'solid');
        t = setTimeout(() => { armed = false; btn.textContent = orig; btn.classList.remove('solid'); if (btn.id !== 'reset') btn.classList.remove('danger'); }, 6000);
        return;
      }
      clearTimeout(t); armed = false;
      btn.disabled = true; btn.textContent = '처리 중…';
      try { await run(); btn.textContent = '완료했습니다'; }
      catch (err) { btn.textContent = orig; }
      setTimeout(() => { btn.disabled = false; btn.textContent = orig; btn.classList.remove('solid'); if (btn.id !== 'reset') btn.classList.remove('danger'); }, 1500);
    };
  }
  twoStep($('reset'), '정말 모두 지울까요? 한 번 더 누르면 삭제됩니다', async () => {
    await App.db.delCol('responses');
    await App.db.delCol('praises');
    await App.db.del('teamManual/current');
    await App.db.replace('session/state', App.defaultState());
    resultFilled = false; $('rs').value = ''; $('pt').value = ''; updateFull();
  });
  twoStep($('test'), '지금 입력된 내용을 덮어씁니다. 한 번 더 누르세요', makeTestData);

  async function makeTestData() {
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const W1 = ['성장', '버티기', '전환', '롤러코스터', '새로움', '동료', '성장', '배움', '숨가쁨', '전환', '도전', '감사', '성장', '실험'];
    const W2 = ['여유', '연결', '확장', '여유', '몰입', '건강', '함께', '깊이', '여유', '실행', '균형', '재미', '연결', '단단함'];
    const RS = ['신규 과정 3개 동시 오픈', '팀 재편으로 역할이 바뀜', '임원 과정 첫 기수 성공', '연휴 뒤 몰아친 일정', '좋은 동료를 새로 만남', '기획안이 한 번에 통과', '야근이 이어짐', '휴가로 재충전', '현장 반응이 뜨거웠음', '예산 조정으로 일정 변경'];
    const NK = ['일단 해보는 실행러', '조용한 정리왕', '분위기 메이커', '꼼꼼한 마무리 담당', '아이디어 발전소', '든든한 버팀목', '빠른 손', '질문 많은 탐험가'];
    const MB = ['ENFP', 'ISTJ', 'INFJ', 'ENTJ', 'ISFJ', 'ENTP', 'INTP', 'ESFJ', ''];
    const ST = ['처음 보는 일 구조 잡기', '분위기 읽고 띄우기', '문서 깔끔하게 정리하기', '마감 지키기', '사람 연결하기', '데이터로 설명하기', '디자인 감각', '끈기'];
    const WS = ['아침에 집중이 잘 됩니다. 말로 먼저 정리한 뒤 문서로 옮깁니다.', '혼자 충분히 생각한 뒤 이야기하는 편입니다.', '빠르게 초안을 만들고 여러 번 고칩니다.', '마감 3일 전에 초안이 나와야 마음이 편합니다.'];
    const PS = ['겉은 밝고 속은 걱정이 많습니다. "늘 여유 있어 보인다"는 오해를 받습니다.', '말수가 적어 차가워 보이지만 관심은 많습니다.', '급해 보이지만 사실 계획이 있습니다.'];
    const RP = ['피드백은 사람들 앞이 아니라 따로 주세요.', '회의 중 휴대폰 보면서 답하지 않기.', '급한 일은 메신저보다 전화로 알려 주세요.', '결정 이유를 함께 알려 주세요.'];
    const TS = ['말수가 줄고 답장이 한 단어가 됩니다.', '점심을 거릅니다.', '이어폰을 오래 끼고 있습니다.'];
    const RC = ['점심에 혼자 산책 30분.', '"잘하고 있다"는 한마디.', '맛있는 커피 한 잔.', '주말에 푹 자기.'];
    const PR = ['올해 가장 바쁠 때 먼저 손 내밀어 주셔서 정말 든든했습니다. 고맙습니다.', '회의 때마다 차분하게 정리해 주셔서 방향을 잃지 않을 수 있었습니다.', '늘 웃으며 인사해 주셔서 사무실 분위기가 밝아졌습니다. 내년에도 부탁드려요.', '어려운 요청에도 "해 보죠"라고 말해 주셔서 큰 힘이 됐습니다.'];

    let st = H.state;
    let assign = st.praiseAssignments, round = st.praiseRound;
    if (!assign) { assign = App.makeAssignments(); round = App.now(); await setState({ praiseAssignments: assign, praiseRound: round }); }
    await App.db.delCol('praises');
    for (const [i, m] of App.members.entries()) {
      let s = Math.round(Math.random() * 6 - 2);
      const months = App.emptyMonths().map((d) => { s = Math.max(-10, Math.min(10, s + Math.round(Math.random() * 8 - 4))); return { m: d.m, score: s, reason: Math.random() < 0.55 ? pick(RS) : '' }; });
      await App.db.replace('responses/' + m.id, {
        joinedAt: App.now(), yearWord: W1[i % W1.length], nextYearWord: W2[i % W2.length],
        emotion: { months, bestMoment: '현장에서 "덕분에 달라졌다"는 말을 들은 날', lowestLesson: '혼자 다 하려 하지 않기', completedAt: App.now() },
        manual: { nickname: pick(NK), mbti: pick(MB), strengths: App.shuffle(ST).slice(0, 3).map((s, k) => (k < 2 || Math.random() < 0.5 ? s : '')), workStyle: pick(WS), personality: pick(PS), respect: pick(RP), tiredSignal: pick(TS), recharge: pick(RC), completedAt: App.now() },
        praise: { round, sentTo: assign[m.id].slice() },
        updatedAt: App.now()
      });
    }
    for (const m of App.members) {
      for (const to of assign[m.id]) await App.db.add('praises', { toId: to, text: pick(PR), createdAt: App.now(), round });
    }
    const SAMPLE_TEAM = "[요약]\n[화면 1] 우리 팀은 이런 팀입니다\n결론: 기획부터 마무리까지, 팀 안에서 완결하는 팀입니다\n- 시작부터 끝까지 | \"새로운 방식 제안\"부터 \"마감 지키기\"까지 한 팀에 있습니다\n- 마음을 잇는 힘 | \"교육생 마음 읽기\"와 \"협업 부서와 소통\"이 강점입니다\n- 남기고 퍼뜨리기 | 매뉴얼과 자동화 도구가 다른 팀에서도 쓰였습니다\n\n[화면 2] 우리가 함께 조심할 것\n결론: 일이 몰릴 때, 조용한 신호를 놓치지 않아야 합니다\n- 몰리는 시기 | 과정 오픈이 겹치는 달은 미리 업무를 나눕니다\n- 조용한 신호 | 말수·질문이 줄면 따로 가볍게 안부를 묻습니다\n- 변경의 이유 | 바뀔 때는 이유와 범위를 함께 알립니다\n\n[화면 3] 2027년, 우리는 이렇게 합니다\n결론: 먼저 말하고, 먼저 묻는 팀이 되겠습니다\n- 요청 한 줄 | 요청할 때 \"무엇을·왜·언제까지\"를 첫 줄에 씁니다\n- 마지막 5분 | 회의 끝 5분은 결정·담당·기한을 글로 남깁니다\n- 따로 한마디 | 잘된 일에는 \"잘하고 있다\"를 아끼지 않습니다\n\n[전문]\n우리 팀 사용설명서 (2026)\n\n■ 한 줄 결론\n기획부터 마무리까지, 팀 안에서 완결하는 팀입니다.\n\n■ 1. 주요 기능 — 우리 팀의 강점\n1) 시작부터 끝까지 팀 안에서 해냅니다\n\"새로운 방식 제안하기\"(박귀애 RF)부터 \"마감 지키기\"(추현준 RF)까지 한 팀에 모여 있습니다. 새 과정을 처음 열 때 가장 빛납니다.\n2) 교육생과 협업 부서의 마음을 잇습니다\n\"교육생 마음 읽기\"(양다은 RF)와 \"협업 부서와 소통하기\"(이화연 RF)가 강점입니다. 올해의 최고 순간도 대부분 교육생과 동료의 반응이었습니다.\n3) 일을 남기고 다른 팀까지 퍼뜨립니다\n\"운영 매뉴얼이 다른 팀에도 공유됨\", \"자동화 도구를 다른 팀에서 빌려 간 날\"처럼 결과물이 팀 밖에서도 쓰였습니다.\n\n■ 2. 알려진 이슈 — 함께 보완할 점\n1) 일이 한꺼번에 몰리는 시기\n13명 중 5명의 최저점이 3월이었고, 이유는 \"동시 오픈 운영이 몰림\"처럼 겹친 일정이었습니다. 겹치는 달을 미리 확인하고 업무를 나눕니다.\n2) 알아차리기 어려운 조용한 신호\n지쳤을 때 신호가 \"답장이 한 단어가 됩니다\"처럼 대부분 줄어드는 형태입니다. 신호가 보이면 따로 가볍게 안부를 묻습니다.\n3) 이유 없이 바뀌는 기준과 요청\n\"데이터 기준이 여러 번 바뀜\", \"목적을 모른 채 급한 요청이 이어짐\"이 힘든 이유였습니다. 바꿀 때는 이유와 범위를, 요청할 때는 목적을 함께 알립니다.\n\n■ 3. 조합의 힘 — 서로 다른 특성이 만나면\n1) 말로 먼저 풀어내는 분들과 혼자 생각한 뒤 말하는 분들이 짝을 이루면, 회의에서 나온 생각이 다음 날 정리된 글로 돌아옵니다.\n2) 빠르게 초안을 만드는 분들과 계획을 먼저 세우는 분들이 만나면, 속도와 완성도를 함께 잡을 수 있습니다.\n3) 새로운 방식을 제안하는 분들과 숫자로 검증하는 분들이 만나면, 아이디어가 근거를 갖춘 제안이 됩니다.\n\n■ 4. 취급 주의 — 서로 지킬 약속\n1) 말할 때는 결론, 이유, 기한을 함께 전합니다.\n2) 일정 변경과 번복은 하루 전까지 먼저 알립니다.\n3) 회의는 시간을 지키고, 휴대폰 대신 얼굴을 보고, 결과는 글로 남깁니다.\n4) 급한 일이 아니면 집중 시간과 퇴근 후 시간을 지켜 줍니다.\n5) 의견은 한 번 더 듣고, 피드백은 따로 전합니다.\n\n■ 5. 정비 안내 — 2026년 감정 곡선에서 읽은 것\n연초(1-3월)에는 일과 변화가 한꺼번에 겹쳐 함께 힘들었습니다. 6-9월에는 각자의 일이 현장에서 쓰이고 인정받으며 함께 좋았습니다. 바쁜 시기가 오기 전에 먼저 말하고 먼저 묻는 것이 가장 큰 교훈입니다.\n\n■ 6. 2027년 실천 5가지\n1) 요청할 때 \"무엇을·왜·언제까지\"를 첫 줄에 씁니다.\n2) 회의 마지막 5분은 결정·담당·기한을 글로 남깁니다.\n3) 변경은 이유와 함께 하루 전에 알립니다.\n4) 과정이 겹치는 시기 전에 30분 부하 점검 자리를 엽니다.\n5) 조용한 신호를 보면 따로 한마디 건네고, 잘된 일에는 \"잘하고 있다\"를 아끼지 않습니다.";
    await App.db.replace('teamManual/current', { markdown: SAMPLE_TEAM, pastedAt: App.now() });
    $('rs').value = SAMPLE_TEAM; resultFilled = true;
    await setState({ revealedPraises: [], praiseTarget: null, teamSlide: 0 });
  }
})();
