<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>큰 화면 · 우리 팀 사용설명서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css?v=20260923b">
</head>
<body class="s">
<div class="s-frame" id="frame">
  <div class="s-stage" id="stage"></div>
  <div class="s-corner" id="corner"></div>
  <button type="button" class="sfx-btn" id="sfx" aria-label="효과음 켜기">🔇 소리 켜기</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="qrcode.js?v=20260923b"></script>
<script src="config.js?v=20260923b"></script>
<script src="app.js?v=20260923b"></script>
<script>
(function () {
  'use strict';
  const e = App.esc;
  const frame = document.getElementById('frame');
  const $corner = document.getElementById('corner');
  const V = { state: null, resp: {}, praises: [], team: null, selMonth: null, lastHtml: '', lastCorner: '' };

  /* ---------------- 1920×1080 화면을 창 크기에 맞춤 ---------------- */
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    frame.style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' + (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  /* ---------------- 참가자 주소 QR ---------------- */
  const PURL = App.participantUrl();
  let QR = '';
  try {
    const q = qrcode(0, 'M');
    q.addData(PURL);
    q.make();
    QR = q.createDataURL(12, 0);
  } catch (err) { QR = ''; }
  const qrImg = (alt) => (QR ? '<img src="' + QR + '" alt="' + e(alt) + '">' : '<div style="color:#0F1626;font-size:14px;word-break:break-all">' + e(PURL) + '</div>');

  /* ---------------- 데이터 ---------------- */
  App.demoBadge();
  App.ready.then(() => {
    App.watchMembers(() => { N = App.members.length; V.lastHtml = ''; render(); });
    App.db.watchDoc('session/state', (d) => { V.state = App.withDefaults(d); render(); });
    App.db.watchCol('responses', (l) => { V.resp = {}; l.forEach((r) => (V.resp[r.id] = r)); render(); });
    App.db.watchCol('praises', (l) => { V.praises = l; render(); });
    App.db.watchDoc('teamManual/current', (d) => { V.team = d; render(); });
  });

  /* 화면의 ‹ › 버튼으로 넘기기 */
  function moveTeamSlide(d) {
    if (!V.state || V.state.stage !== 'team_manual' || !V.team) return;
    const n = App.parseTeam(V.team.markdown).slides.length;
    const cur = Math.min(V.state.teamSlide || 0, n - 1);
    const nx = cur + d;
    if (nx >= 0 && nx < n) App.db.set('session/state', { teamSlide: nx });
  }
  /* 큰 화면은 절대 스크롤되지 않게 고정 */
  document.addEventListener('scroll', (ev) => { const t = ev.target === document ? document.scrollingElement : ev.target; if (t && (t.scrollTop || t.scrollLeft)) { t.scrollTop = 0; t.scrollLeft = 0; } }, true);
  document.addEventListener('mousedown', (ev) => { if (ev.target.closest('[data-tm]')) ev.preventDefault(); });
  document.addEventListener('click', (ev) => { const b = ev.target.closest('[data-tm]'); if (b && !b.disabled) moveTeamSlide(Number(b.dataset.tm)); });
  /* 키보드 ← → 로 우리 팀 사용설명서 슬라이드 넘기기 */
  addEventListener('keydown', (ev) => {
    if (!V.state || V.state.stage !== 'team_manual' || !V.team) return;
    const n = App.parseTeam(V.team.markdown).slides.length;
    const cur = Math.min(V.state.teamSlide || 0, n - 1);
    if (ev.key === 'ArrowRight' && cur < n - 1) App.db.set('session/state', { teamSlide: cur + 1 });
    if (ev.key === 'ArrowLeft' && cur > 0) App.db.set('session/state', { teamSlide: cur - 1 });
  });

  /* ---------------- 효과음 ---------------- */
  const SFX = (() => {
    let ctx = null, on = App.ls.get('canmeeting_sfx', false);
    const btn = document.getElementById('sfx');
    const paint = () => { btn.textContent = on ? '🔊 소리 켬' : '🔇 소리 켜기'; btn.classList.toggle('on', on); };
    const ensure = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); return ctx; };
    btn.onclick = () => { on = !on; App.ls.set('canmeeting_sfx', on); paint(); if (on) { ensure(); tone([880], 0.12, 'sine', 0.25); } };
    paint();
    /* 음 하나 */
    function note(freq, start, dur, type, vol) {
      const c = ensure();
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, c.currentTime + start);
      g.gain.setValueAtTime(0.0001, c.currentTime + start);
      g.gain.exponentialRampToValueAtTime(vol || 0.3, c.currentTime + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
    }
    function tone(freqs, dur, type, vol, gap) {
      if (!on) return;
      try { freqs.forEach((f, i) => note(f, i * (gap == null ? dur * 0.8 : gap), dur, type, vol)); } catch (e) {}
    }
    return {
      reveal: () => tone([523.25, 659.25, 783.99, 1046.5], 0.22, 'triangle', 0.28, 0.12),   /* 이름 공개 */
      quizStart: () => tone([659.25, 880], 0.16, 'square', 0.16, 0.12),                      /* 문제 시작 */
      answer: () => tone([523.25, 783.99, 1046.5, 1318.5], 0.3, 'triangle', 0.3, 0.14),      /* 정답 공개 */
      fanfare: () => tone([523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98], 0.34, 'sawtooth', 0.2, 0.16),
      chime: () => tone([987.77, 1318.5], 0.3, 'sine', 0.22, 0.1),                            /* 칭찬·한마디 */
      tick: () => tone([1200], 0.06, 'square', 0.12),
      timeup: () => tone([392, 311.13], 0.5, 'sine', 0.25, 0.22)
    };
  })();

  /* ---------------- 그리기 ---------------- */
  function render() {
    if (!V.state) return;
    const st = V.state.stage;
    const brk = !!V.state.breakOn;
    const qz = V.state.quiz && V.state.quiz.phase ? V.state.quiz : null;
    const out = qz ? drawQuiz(qz) : brk ? drawBreak() : draw(st);
    const html = '<div class="s-stage ' + out.cls + '">' + out.html + '</div>';
    const vk = qz ? 'quiz:' + qz.phase + ':' + (qz.id || '') + ':' + qz.startedAt : brk ? 'break' : viewKey(st);
    const newView = vk !== V.lastVk;
    if (newView) V.seen = {};
    if (html !== V.lastHtml) {
      V.lastHtml = html;
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const el = tmp.firstElementChild;
      const old = frame.querySelector('.s-stage:not(.leaving)');
      if (newView && V.lastVk != null && !reduceMotion) {
        /* 화면이 바뀔 때: 이전 화면은 흐려지며 사라지고, 새 화면은 차례로 떠오름 */
        el.classList.add('enter');
        old.classList.add('leaving');
        old.after(el);
        setTimeout(() => old.remove(), 700);
      } else {
        old.replaceWith(el);
        if (newView) el.classList.add('enter');
      }
      if (out.after) out.after(el);
      enhance(el);
    }
    if (newView) playSfx(vk, qz, st);
    V.lastVk = vk;
    /* 오른쪽 아래 QR: 접속 안내 화면(가운데에 큰 QR이 있음)을 뺀 모든 화면 */
    const corner = st === 'lobby' && !brk && !qz ? '' : '<div class="qr">' + qrImg('참가자 접속 QR') + '</div>';
    if (corner !== V.lastCorner) { V.lastCorner = corner; $corner.innerHTML = corner; }
    /* 점수판이 오른쪽을 쓰는 화면에서는 QR을 왼쪽 아래로 옮김 */
    $corner.className = 's-corner';
  }

  let N = App.members.length;
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* 같은 단계 안에서도 사람·슬라이드가 바뀌면 '새 화면'으로 봄 */
  function viewKey(st) {
    const s = V.state;
    if (st === 'farewell') return st + ':' + s.closingCurrent + ':' + s.closingStartedAt;
    if (st === 'emotion_person') return st + ':' + s.emotionCurrent;
    if (st === 'manual_person') return st + ':' + s.manualCurrent;
    if (st === 'praise') return st + ':' + s.praiseTarget;
    if (st === 'team_manual') return st + ':' + (s.teamSlide || 0) + ':' + (V.team ? V.team.pastedAt : '');
    return st;
  }
  /* 새로 들어온 단어·완료 표시·칭찬 카드에만 등장 효과 */
  function enhance(el) {
    V.seen = V.seen || {};
    let n = 0;
    el.querySelectorAll('[data-pop]').forEach((node) => {
      const k = node.getAttribute('data-pop');
      if (V.seen[k]) return;
      V.seen[k] = true;
      node.classList.add('pop');
      node.style.animationDelay = Math.min(n++ * 55, 900) + 'ms';
    });
  }
  const R = (id) => V.resp[id];

  function draw(st) {
    switch (st) {
      case 'title': return drawTitle();
      case 'lobby': return drawLobby();
      case 'input_emotion': return drawInput('나의 감정 곡선을 입력해 주세요',
        ['휴대폰 화면을 따라 1월부터 ' + App.MONTH_COUNT + '월까지 채워 주세요', '좋았던 달은 오른쪽(+10), 힘들었던 달은 왼쪽(-10)', '이유는 쓰고 싶은 달만 쓰면 됩니다'], App.done.emotion);
      case 'emotion_person': return drawEmotionPerson();
      case 'emotion_team': return drawEmotionTeam();
      case 'input_manual': return drawInput('나의 사용설명서를 써 주세요',
        ['나를 제품이라고 생각하고 설명서를 씁니다 (필수 4개)', '다 쓰면 이어서, 배정된 두 분에게 칭찬을 보냅니다', '누가 썼는지는 아무도 알 수 없습니다'], App.done.manual, true);
      case 'manual_person': return drawManual();
      case 'praise': return drawPraise();
      case 'team_manual': return drawTeamManual();
      case 'input_keyword': return drawInput('2027년, 나의 한 단어',
        ['내년에 붙잡고 싶은 단어 하나를 올려 주세요', '다 올라오면 우리 팀의 키워드를 함께 봅니다'], App.done.nextYearWord);
      case 'closing': return drawClosing();
      case 'farewell': return drawFarewell();
    }
    return { cls: '', html: '' };
  }

  /* 화면이 바뀌는 순간에 맞춰 효과음 */
  function playSfx(vk, qz, st) {
    if (V.lastVk == null) return;   /* 첫 화면에서는 소리 없음 */
    if (qz) {
      if (qz.phase === 'wheel') SFX.tick();
      else if (qz.phase === 'question') SFX.quizStart();
      else if (qz.phase === 'reveal') SFX.answer();
      else if (qz.phase === 'final') SFX.fanfare();
      return;
    }
    if (st === 'manual_person' && V.state.manualRevealed) { SFX.reveal(); return; }
    if (st === 'praise' && V.state.praiseTarget) { SFX.chime(); return; }
    if (st === 'farewell' && V.state.closingCurrent) { SFX.chime(); return; }
    if (st === 'closing') { SFX.chime(); return; }
  }

  function fmtDate(d) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    return m ? Number(m[1]) + '년 ' + Number(m[2]) + '월 ' + Number(m[3]) + '일' : '';
  }
  /* 쉬는 시간: 진행자 화면 버튼으로 아무 때나 띄움 */
  function drawBreak() {
    return { cls: 's-title', html: '<div class="eyebrow">' + e(CONFIG.EVENT_TITLE) + '</div><div class="main">Break</div>' };
  }
  /* ---------- 팝업 퀴즈 ---------- */
  function quizAnswered(qid) { return App.members.filter((m) => (((R(m.id) || {}).quizPick || {})[qid] || {}).pick != null).length; }
  function quizFilled(qid) { return App.members.filter((m) => { const v = ((R(m.id) || {}).quiz || {})[qid]; return v != null && v !== ''; }).length; }
  function nameList(ids) { return ids.map((id) => e(App.label(id))).join(', '); }
  function qBars(rows, answer, namesOf) {
    const list = (Array.isArray(answer) ? answer : [answer]).map(String);
    const max = Math.max.apply(null, rows.map((r) => r[1]).concat([1]));
    return '<div class="qbars">' + rows.map((r, i) => {
      const who = namesOf ? namesOf(String(r[0])) : '';
      return '<div class="qbar' + (list.includes(String(r[0])) ? ' hit' : '') + '" data-pop="qb' + i + '">' +
        '<span class="lab">' + e(String(r[0])) + '</span>' +
        '<span class="bar"><i style="width:' + Math.round((r[1] / max) * 100) + '%"></i></span>' +
        '<span class="cnt">' + r[1] + '명</span>' +
        (who ? '<span class="who">' + who + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function drawQuiz(q) {
    const N = App.quizPlayers().length;
    if (q.phase === 'final') return drawQuizFinal();
    const z = App.quizById(q.id);
    if (!z) return { cls: 's-title', html: '<div class="main">Quiz</div>' };
    const pts = App.pointsText(z, q);
    if (q.phase === 'input') {
      return {
        cls: 's-quiz input',
        html: '<div class="qeyebrow" data-pop>POP QUIZ</div><h1 class="s-h1" data-pop>' + e(z.inputTitle) + '</h1>' +
          (z.inputNote ? '<p class="qnote" data-pop>' + e(z.inputNote) + '</p>' : '') +
          '<p class="s-lead" data-pop>휴대폰에서 입력해 주세요. 무엇에 쓰는지는 곧 알려 드립니다</p>' +
          '<div class="qcount" data-pop><em>' + quizFilled(z.id) + '</em> / ' + App.members.length + ' 입력</div>'
      };
    }
    if (q.phase === 'wheel') {
      const T = App.POINT_TABLE, n = T.length, seg = 360 / n;
      const wheel = '<svg class="wheelsvg" viewBox="-110 -110 220 220" aria-hidden="true">' +
        '<g id="wg">' + T.map((row, i) => {
          const a0 = (i * seg - 90) * Math.PI / 180, a1 = ((i + 1) * seg - 90) * Math.PI / 180;
          const x0 = 100 * Math.cos(a0), y0 = 100 * Math.sin(a0), x1 = 100 * Math.cos(a1), y1 = 100 * Math.sin(a1);
          const mid = ((i + 0.5) * seg - 90) * Math.PI / 180;
          const tx = 66 * Math.cos(mid), ty = 66 * Math.sin(mid);
          return '<path d="M0 0 L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A100 100 0 0 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z" fill="' + (i % 2 ? '#1B2438' : '#243049') + '" stroke="#0F1626" stroke-width="1"/>' +
            '<text x="' + tx.toFixed(2) + '" y="' + ty.toFixed(2) + '" text-anchor="middle" dominant-baseline="central" fill="' + (i >= n - 3 ? '#FFD166' : '#F5F7FB') + '" font-size="15" font-weight="800" transform="rotate(' + ((i + 0.5) * seg) + ' ' + tx.toFixed(2) + ' ' + ty.toFixed(2) + ')">' + row[0] + '</text>';
        }).join('') + '</g>' +
        '<circle r="16" fill="#0F1626" stroke="#5FC3CF" stroke-width="3"/>' +
        '<path d="M0 -84 L-12 -110 L12 -110 Z" fill="#FFD166" stroke="#0F1626" stroke-width="2" stroke-linejoin="round"/></svg>';
      const done = q.points && q.points.length;
      return {
        cls: 's-quiz wheel',
        html: '<div class="qeyebrow" data-pop>이번 문제의 배점</div>' +
          '<div class="wheelbox">' + wheel + '</div>' +
          '<div class="wheelout" id="wout">' + (done ? '' : '돌아가는 중입니다') + '</div>',
        after: (el) => spinWheel(el, q)
      };
    }
    if (q.phase === 'question') {
      const left = Math.max(0, App.QUIZ_SECONDS - Math.floor((Date.now() - (q.startedAt || 0)) / 1000));
      return {
        cls: 's-quiz ask',
        html: '<div class="qeyebrow" data-pop>POP QUIZ · ' + e(pts) + '</div><h1 class="s-h1" data-pop>' + e(z.question) + '</h1>' +
          '<div class="qchoices">' + (q.choices || []).map((c, i) => '<div class="qc" data-pop="qc' + i + '"><b>' + (i + 1) + '</b>' + e(c) + '</div>').join('') + '</div>' +
          '<div class="qtimer"><div class="clock" id="qclock">' + left + '</div><div class="qsub">초 · 제출 <em id="qsent">' + quizAnswered(z.id) + '</em> / ' + N + '명</div></div>',
        after: (el) => startClock(el, q.startedAt)
      };
    }
    const res = (V.state.quizResults || {})[z.id];
    if (!res) return { cls: 's-quiz', html: '<h1 class="s-h1">정답을 계산하고 있습니다</h1>' };
    const top = res.rows.filter((r) => r.points > 0).slice(0, 3);
    const rank = App.quizRanking(App.QUIZZES.map((x) => (V.state.quizResults || {})[x.id]).filter(Boolean));
    const d = res.detail || {};
    let stats = '';
    const vals = d.values || [];
    /* 모든 문항 공통: 보기별로 우리가 무엇을 골랐는지 (정답·오답 모두) */
    const pickCnt = {};
    (res.choices || []).forEach((ch) => (pickCnt[ch] = 0));
    (res.rows || []).forEach((r) => { if (pickCnt[r.pick] != null) pickCnt[r.pick]++; });
    const pickNames = (g) => (res.rows || []).filter((r) => String(r.pick) === g).map((r) => r.id);
    const picksBlock = (withNames) => '<div class="qsub2">우리가 고른 답</div>' +
      qBars(Object.keys(pickCnt).map((k) => [k, pickCnt[k]]), res.answers || res.answer, withNames ? (g) => nameList(pickNames(g)) : null);
    if (d.kind === 'count') {
      const namesOf = (g) => nameList(vals.filter((v) => String(v.value) === g).map((v) => v.id));
      stats = '<div class="qsub2">우리 팀의 실제 응답</div>' + qBars(d.rows || [], res.answers || res.answer, namesOf) +
        ((res.answers || []).length > 1 ? '<p class="qhint">같은 수로 1위가 둘 이상이라 모두 정답입니다</p>' : '') + picksBlock(true);
    } else if (d.kind === 'max' || d.kind === 'sum') {
      const vs = vals.slice().sort((a, b) => Number(b.value) - Number(a.value));
      const mx = Math.max.apply(null, vs.map((v) => Number(v.value)).concat([1]));
      stats = '<div class="qsub2">우리 팀의 실제 응답</div><div class="qvals">' + vs.map((v, i) =>
        '<div class="qv' + (d.kind === 'max' && Number(v.value) === mx ? ' hit' : '') + '" data-pop="qv' + i + '">' +
        '<span class="nm">' + e(App.label(v.id)) + '</span>' +
        '<span class="bar"><i style="width:' + Math.round((Number(v.value) / mx) * 100) + '%"></i></span>' +
        '<span class="num">' + e(String(v.value)) + (d.unit || '') + '</span></div>').join('') + '</div>' +
        (d.kind === 'sum' ? '<p class="qhint">모두 더하면 ' + e(res.answer) + '</p>' : '') + picksBlock(true);
    } else {
      stats = picksBlock(false) + '<p class="qhint">누가 골랐는지는 보여 주지 않습니다</p>';
    }
    return {
      cls: 's-quiz reveal',
      html: '<div class="qeyebrow" data-pop>정답</div><h1 class="s-h1" data-pop>' + e(res.answer) + '</h1>' +
        '<div class="qcols"><div class="qstats">' + stats + '</div>' +
        '<div class="qscore"><div class="qsh">이번 문항</div>' +
        (top.length
          ? '<ul class="qtop">' + top.map((r, i) => '<li class="m' + (i + 1) + '" data-pop="qt' + i + '"><span class="md">' + ['🥇', '🥈', '🥉'][i] + '</span><span class="nm">' + e(App.label(r.id)) + '</span><b>+' + r.points + '</b></li>').join('') + '</ul>'
          : '<p class="qnone">맞힌 분이 없습니다</p>') +
        '<div class="qsh">누적 순위</div><ol class="qrank">' + rank.map((r, i) =>
          '<li class="r' + (i + 1) + '"><span class="no">' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) + '</span><span class="nm">' + e(App.label(r.id)) + '</span><b>' + r.points + '</b></li>').join('') + '</ol></div></div>',
      after: null
    };
  }
  function wireQuizNames(el, res) {
    const box = el.querySelector('#qnames');
    if (!box) return;

  /* 배점 룰렛: 멈추기를 누르면 3초 동안 서서히 멈춤 */
  function spinWheel(el, q) {
    const g = el.querySelector('#wg'), out = el.querySelector('#wout');
    if (!g) return;
    const T = App.POINT_TABLE, n = T.length, seg = 360 / n;
    const SPIN = 400;            /* 초당 회전 각도 */
    const SLOW = 3200;           /* 멈추는 데 걸리는 시간 */
    const base = q.startedAt || Date.now();
    const angAt = (t) => ((t - base) / 1000) * SPIN;
    cancelAnimationFrame(V.wheelRaf);
    const tick = () => {
      const now = Date.now();
      let ang;
      if (!q.stopAt) {
        ang = angAt(now);
      } else {
        const a0 = angAt(q.stopAt);
        const want = 360 - ((q.stopIdx || 0) + 0.5) * seg;
        const target = a0 + 3 * 360 + (((want - a0) % 360) + 360) % 360;
        const p = Math.min(1, (now - q.stopAt) / SLOW);
        const ease = 1 - Math.pow(1 - p, 3);
        ang = a0 + (target - a0) * ease;
        if (p >= 1 && out && q.points) {
          out.innerHTML = '<b>' + App.pointsText(App.quizById(q.id), q) + '</b>';
          out.classList.add('done');
          if (!V.wheelSfx) { V.wheelSfx = true; SFX.answer(); }
        }
      }
      g.setAttribute('transform', 'rotate(' + (ang % 360).toFixed(2) + ')');
      V.wheelRaf = requestAnimationFrame(tick);
    };
    V.wheelSfx = !!(q.points && q.stopAt && Date.now() - q.stopAt > SLOW);
    tick();
  }

      const left = Math.max(0, App.QUIZ_SECONDS - Math.floor((Date.now() - (startedAt || 0)) / 1000));
      c.textContent = left;
      c.classList.toggle('hot', left <= 3);

      if (sent && V.state.quiz) sent.textContent = App.members.filter((m) => (((R(m.id) || {}).quizPick || {})[V.state.quiz.id] || {}).pick != null).length;
      if (left <= 0) clearInterval(V.qTimer);

  /* ---------- 감정 곡선: 팀 전체 ---------- */
  function teamStats() {
    const people = App.members.map((m) => ({ m, months: App.months(R(m.id)) })).filter((p) => p.months.some((d) => d.score != null));
    const stats = Array.from({ length: App.MONTH_COUNT }, (_, i) => {
      const vals = people.map((p) => p.months[i].score).filter((v) => v != null);
      if (!vals.length) return null;
      const avg = vals.reduce((a, v) => a + v, 0) / vals.length;
      const sd = Math.sqrt(vals.reduce((a, v) => a + (v - avg) * (v - avg), 0) / vals.length);
      return { m: i + 1, avg, sd, n: vals.length };
    });
    return { people, stats };
  }

      row('보증 기간', '2027년 한 해 동안, 함께 일하는 모든 날') +
      row('무상 수리', '커피 한 잔, 진심 어린 "고마워요" 한마디') +
      row('보증 제외', '⚠ 주의사항을 지키지 않아 생긴 고장') +
      '</table><p class="wn">본 제품은 동료의 칭찬을 받을수록 성능이 좋아집니다.</p><div class="stamp">품질 검사<br><b>합격</b><br>2026 캔미팅</div></div>';
  }
  function robotManualHtml(id, mn, hidden, idx) {
    mn = mn || {};
    const mbti = (mn.mbti || '').trim().toUpperCase();
    const box = (p, i) => {
      const raw = p.list ? (mn.strengths || []).filter((s) => (s || '').trim()) : (mn[p.k] || '').trim();
      const val = p.list ? (raw.length ? '<ul>' + raw.map((s) => '<li>' + e(s.trim()) + '</li>').join('') + '</ul>' : '—') : (raw ? e(raw) : '—');
      return '<div class="box' + (p.warn ? ' warn' : '') + '"><div class="k">' + icon(p.k) + p.t + '</div><div class="v">' + val + '</div></div>';
    };
    const name = hidden
      ? '<div class="nm hidden-name">? ? ? ? ?</div><div class="guess">누구의 설명서일까요?</div>'
      : '<div class="reveal"><div class="nm">' + e(App.label(id)) + '</div>' + ((mn.nickname || '').trim() ? '<div class="nick">"' + e(mn.nickname.trim()) + '"</div>' : '') + '</div>';
    return '<div class="rb3">' +
      '<div class="c1"><div class="eyebrow">USER MANUAL · 2026 EDITION</div><div class="ttl">사용설명서</div>' + name +
        '<div class="model">MODEL ' + (hidden ? '????' : (mbti ? e(mbti) : '—')) + '</div>' +
        '<div class="rbox">' + robotSvg(hidden ? '?' : (mbti || '♥'), hidden) + '</div>' +
        '<div class="foot"><div class="bar" aria-hidden="true"></div><div class="pg">' + idx + ' / ' + N + '</div></div></div>' +
      '<div class="c2 col">' + MANUAL_SECS.slice(0, 3).map((p, i) => box(p, i)).join('') + '</div>' +
      '<div class="c3"><div class="col">' + MANUAL_SECS.slice(3).map((p, i) => box(p, i + 3)).join('') + '</div>' + warrantyHtml(id, mn, hidden, idx) + '</div>' +
      '</div>';
  }
  function robotAfter(el) {
    /* 글이 길면 글자 크기를 줄여 칸에 맞춤 */
    el.querySelectorAll('.col').forEach((col) => {
      let size = 32;
      col.style.fontSize = size + 'px';
      while (col.scrollHeight > col.clientHeight + 2 && size > 16) { size -= 1; col.style.fontSize = size + 'px'; }
    });
  }


  /* ---------- 칭찬 공개 ---------- */
  function drawPraise() {
    const st = V.state;
    if (!st.praiseTarget) return { cls: 's-praise', html: '<h1 class="s-h1">칭찬을 공개합니다</h1><p class="s-lead">누가 썼는지는 아무도 모릅니다. 한 사람씩, 도착한 칭찬을 함께 읽습니다</p>' };
    const id = st.praiseTarget;
    const total = V.praises.filter((p) => p.toId === id && p.round === st.praiseRound).length;
    const shown = (st.revealedPraises || []).filter((p) => p.toId === id);
    const slots = Math.max(total, shown.length);
    let cards = '';
    for (let i = 0; i < slots; i++) cards += shown[i] ? '<div class="pc front" data-pop="p' + shown[i].id + '">' + e(shown[i].text) + '</div>' : '<div class="pc back">?</div>';
    const o = st.praiseOrder, i = o.indexOf(id);
    return {
      cls: 's-praise',
      html: '<h1 class="s-h1">' + e(App.nim(id)) + '에게 도착한 칭찬</h1>' +
        (slots ? '<div class="cards">' + cards + '</div>' : '<p class="s-lead">아직 도착한 칭찬이 없습니다</p>') +
        '<div class="next">' + (i + 1) + ' / ' + N + '</div>'
    };
  }

  /* ---------- 우리 팀 사용설명서 슬라이드 ---------- */
  function drawTeamManual() {
    if (!V.team || !V.team.markdown) return { cls: 's-slide cover', html: '<h1 class="s-h1">우리 팀 사용설명서</h1><p class="s-lead">만들고 있습니다. 잠시만 기다려 주세요</p>' };
    const P = App.parseTeam(V.team.markdown);
    const slides = P.slides;
    const cur = Math.min(Math.max(0, V.state.teamSlide || 0), slides.length - 1);
    const s = slides[cur];
    /* 화면 아래 이전·다음 버튼 (키보드 ← → 도 됨) */
    const page = '<div class="tm-nav"><button type="button" data-tm="-1"' + (cur <= 0 ? ' disabled' : '') + ' aria-label="이전">‹</button><span>' + (cur + 1) + ' / ' + slides.length + '</span><button type="button" data-tm="1"' + (cur >= slides.length - 1 ? ' disabled' : '') + ' aria-label="다음">›</button></div>';
    if (P.mode === 'summary') {
      /* 요약 화면: 제목 → 결론 한 문장 → 항목 카드 3개 */
      return {
        cls: 's-slide tm',
        html: '<div class="tm-eyebrow" data-pop>우리 팀 사용설명서</div>' +
          '<h1 class="s-h1" data-pop>' + e(s.title) + '</h1>' +
          (s.conclusion ? '<div class="tm-conc" data-pop>' + e(s.conclusion) + '</div>' : '') +
          '<div class="tm-items">' + s.items.slice(0, 4).map((it, i) =>
            '<div class="tm-item" data-pop><div class="n">' + (i + 1) + '</div><div class="t">' + e(it.t) + '</div>' + (it.d ? '<div class="d">' + e(it.d) + '</div>' : '') + '</div>').join('') + '</div>' + page
      };
    }
    if (s.cover) return { cls: 's-slide cover', html: '<h1 class="s-h1 fade-in">' + e(s.title) + '</h1>' + (s.body.trim() ? '<div class="body" style="flex:none;max-width:1400px">' + App.md(s.body) + '</div>' : '<p class="s-lead">← → 로 넘깁니다</p>') + page };
    return {
      cls: 's-slide',
      html: '<h1 class="s-h1">' + e(s.title) + '</h1><div class="body" id="sbody">' + App.md(s.body) + '</div>' + page,
      after: (el) => fitText(el.querySelector('#sbody'))
    };
  }
  function fitText(b) {
    if (!b) return;
    let size = 36;
    b.style.fontSize = size + 'px';
    while (b.scrollHeight > b.clientHeight + 2 && size > 24) { size -= 1; b.style.fontSize = size + 'px'; }
    if (b.scrollHeight > b.clientHeight + 2) {
      b.style.columnCount = 2; size = 32; b.style.fontSize = size + 'px';
      while (b.scrollWidth > b.clientWidth + 2 && size > 18) { size -= 1; b.style.fontSize = size + 'px'; }
      while (b.scrollHeight > b.clientHeight + 2 && size > 18) { size -= 1; b.style.fontSize = size + 'px'; }
    }
  }

  /* ---------- 클로징 ---------- */
  /* ---------- 클로징: 내년 키워드 ---------- */
  function drawClosing() {
    const words = App.members.map((m) => (R(m.id) || {}).nextYearWord).filter(Boolean);
    return {
      cls: 's-closing',
      html: '<h1 class="s-h1">2027년, 우리 팀의 키워드</h1><p class="s-lead">' + words.length + '명의 한 단어</p>' +
        '<div style="flex:1;display:flex;align-items:center;justify-content:center">' + App.wordWallHtml(words, 's-wall') + '</div>'
    };
  }

  /* ---------- 담당님 마무리 인사 ---------- */
  function drawFarewell() {
    const st = V.state, cur = st.closingCurrent;
    if (!cur) return { cls: 's-title', html: '<div class="eyebrow">' + e(CONFIG.EVENT_TITLE) + '</div><div class="main">Wrap-up</div>' + (st.closingDone ? '' : '<div class="opening">한 사람씩 마무리 한마디</div>') };
    const order = st.closingOrder || [];
    const i = order.indexOf(cur);
    const left = Math.max(0, App.WORD_SECONDS - Math.floor((Date.now() - (st.closingStartedAt || 0)) / 1000));
    const nx = i >= 0 && i < order.length - 1 ? order[i + 1] : null;
    return {
      cls: 's-word',
      html: '<div class="eyebrow" data-pop>마무리 한마디 · ' + (i + 1) + ' / ' + order.length + '</div>' +
        '<div class="who" data-pop>' + e(App.nim(cur)) + '</div>' +
        '<div class="clock" id="wclock">' + left + '</div><div class="csub">초 남았습니다</div>' +
        (nx ? '<div class="nextone">다음: ' + e(App.label(nx)) + '</div>' : '<div class="nextone">마지막 순서입니다</div>'),
      after: (el) => {
        clearInterval(V.wTimer);
        const c = el.querySelector('#wclock');
        V.wTimer = setInterval(() => {
          if (!document.body.contains(c)) { clearInterval(V.wTimer); return; }
          const s2 = Math.max(0, App.WORD_SECONDS - Math.floor((Date.now() - (V.state.closingStartedAt || 0)) / 1000));
          c.textContent = s2;
          c.classList.toggle('hot', s2 <= 5);
        }, 250);
      }
    };
  }
})();
</script>
</body>
